<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password | Hackademic</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="/portal.css">
  <link rel="stylesheet" href="/footer.css">
</head>
<body>
  <main class="login-card">
    <a href="/" class="brand"><img src="/assets/hackademic-logo.png" alt="Hackademic logo" width="180" height="54"></a>
    <div class="eyebrow">SECURE ACCOUNT RECOVERY</div>
    <h1>Set a new password</h1>
    <p>Choose a password with at least 12 characters.</p>
    <form id="resetForm" hidden>
      <label>New password<input name="password" type="password" minlength="12" maxlength="256" required autocomplete="new-password"></label>
      <label>Confirm new password<input name="confirmPassword" type="password" minlength="12" maxlength="256" required autocomplete="new-password"></label>
      <button class="primary">Update password</button>
    </form>
    <p id="resetStatus" role="status" aria-live="polite"></p>
    <a href="/portal.html">Return to sign in</a>
  </main>
  <script defer src="/reset-password.js"></script>
</body>
</html>
